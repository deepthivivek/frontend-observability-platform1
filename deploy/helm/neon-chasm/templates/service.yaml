apiVersion: v1
kind: Service
metadata:
  name: {{ include "neon-chasm.fullname" . }}
  labels:
    {{- include "neon-chasm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http-gateway
      port: {{ .Values.service.gatewayPort }}
      targetPort: http-gateway
      protocol: TCP
  selector:
    {{- include "neon-chasm.selectorLabels" . | nindent 4 }}
