# Default values for neon-chasm-observability.
replicaCount: 3

namespace: neon-chasm-enterprise

image:
  repository: ghcr.io/neon-chasm/observability-engine
  pullPolicy: IfNotPresent
  tag: "v2.1.0"

imagePullSecrets:
  - name: neon-chasm-registry-secret

serviceAccount:
  create: true
  name: neon-chasm-operator-sa

podSecurityContext:
  runAsNonRoot: false
  fsGroup: 1000

securityContext:
  privileged: false
  capabilities:
    add:
      - SYS_ADMIN
      - NET_ADMIN
      - BPF
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: true

service:
  type: ClusterIP
  port: 4000
  targetPort: 4000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: observability.neonchasm.enterprise.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: neon-chasm-tls-cert
      hosts:
        - observability.neonchasm.enterprise.io

resources:
  limits:
    cpu: 4000m
    memory: 8Gi
  requests:
    cpu: 1000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

env:
  NODE_ENV: "production"
  PORT: "4000"
  MAX_WORKERS: "16"

secrets:
  jwtSecretName: neon-chasm-vault-secret
  encryptionKeyName: neon-chasm-fhe-master-secret
  pqcSeedName: neon-chasm-pqc-lattice-seed

probes:
  liveness:
    path: /healthz
    port: 4000
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /readyz
    port: 4000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2
