receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  tail_sampling:
    decision_wait: 5s
    num_traces: 50000
    expected_new_traces_per_sec: 1000
    policies:
      - name: anomaly-errors-policy
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: tail-latency-policy
        type: latency
        latency:
          threshold_ms: 250
      - name: probabilistic-baseline-policy
        type: probabilistic
        probabilistic:
          sampling_percentage: 15

  batch:
    timeout: 2s
    send_batch_size: 512

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s]
    dimensions:
      - name: http.method
      - name: http.status_code
      - name: service.name
    exemplars:
      enabled: true

exporters:
  otlphttp/neon_chasm:
    endpoint: http://neon-chasm-gateway:4000/api/v1/telemetry
    compression: none
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: neon_chasm
    send_timestamps: true
    metric_expiration: 5m

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlphttp/neon_chasm, spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/neon_chasm, prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/neon_chasm]
