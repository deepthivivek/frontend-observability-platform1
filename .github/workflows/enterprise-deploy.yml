name: Enterprise Production CI/CD & Compliance Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  packages: write

env:
  NODE_VERSION: '20.x'
  IMAGE_NAME: ghcr.io/neon-chasm/observability-engine
  DOCKER_BUILDKIT: 1

jobs:
  test-and-compliance:
    name: 155+ Full-Stack Unit, PQC & Compliance Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Enterprise Dependencies
        run: npm ci

      - name: Validate TypeScript & ESLint Discipline
        run: npm run lint

      - name: Execute Full-Stack Vitest Suite (155+ Unit & Integration Tests)
        run: npm test -- --run
        env:
          NODE_ENV: test
          JWT_SECRET: neon_chasm_test_secret_key_32_characters_long
          PQC_LATTICE_SEED: pqc_seed_test_key_16_bytes
          ENCRYPTION_MASTER_KEY: fhe_master_test_key_32_characters_long

      - name: Run PQC Cryptographic & CBOM Inventory Audit
        run: |
          echo "[PQC] Auditing Post-Quantum Cryptographic Schemes (ML-KEM-1024 & ML-DSA-87)..."
          node -e "
            const { zkpGenomicPrivacy } = require('./server/src/dna/zkpGenomicPrivacy');
            const proof = zkpGenomicPrivacy.generateGenomicProof();
            const verification = zkpGenomicPrivacy.verifyGenomicProof(proof);
            if (!verification.verified) process.exit(1);
            console.log('[PQC] Cryptographic Integrity Verified.');
          "

      - name: Continuous Compliance SOC2 / GDPR / HIPAA Validation
        run: |
          echo "[Compliance] Auditing active controls and generating attestation artifact..."
          node -e "
            const { complianceAuditor } = require('./server/src/governance/complianceAuditor');
            const report = complianceAuditor.generateAttestationReport('GITHUB_ACTIONS_CI');
            if (report.overallScorePct < 95) process.exit(1);
            console.log('[Compliance] Attestation Score: ' + report.overallScorePct + '% (' + report.attestationStatus + ')');
          "

      - name: Production Application Compilation
        run: npm run build

  container-security-and-publish:
    name: Container Security Scanning & Image Release
    needs: test-and-compliance
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:v2.1.0,${{ env.IMAGE_NAME }}:latest
          load: true

      - name: Scan Image with Trivy for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:v2.1.0'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Push Container to Enterprise Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:v2.1.0,${{ env.IMAGE_NAME }}:latest
